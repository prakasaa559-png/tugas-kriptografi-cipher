<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Vigenère Cipher</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        textarea,
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            margin-top: 20px;
            margin-right: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .hasil {
            margin-top: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 8px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Vigenère Cipher</h1>

    <label>Pesan</label>

    <textarea
        id="pesan"
        rows="5"
        placeholder="Masukkan pesan...">
    </textarea>

    <label>Kunci</label>

    <input
        type="text"
        id="kunci"
        placeholder="Contoh: KEY">

    <button onclick="enkripsi()">
        Enkripsi
    </button>

    <button onclick="dekripsi()">
        Dekripsi
    </button>

    <div class="hasil">

        <strong>Hasil:</strong>

        <p id="hasil">
            Belum ada hasil.
        </p>

    </div>

</div>


<script>

function prosesVigenere(teks, kunci, mode) {

    let hasil = "";

    kunci = kunci.toUpperCase();

    let indexKunci = 0;

    for (let i = 0; i < teks.length; i++) {

        let karakter = teks[i];

        if (karakter.match(/[a-zA-Z]/)) {

            let kode = karakter.toUpperCase().charCodeAt(0) - 65;

            let nilaiKunci =
                kunci.charCodeAt(indexKunci % kunci.length) - 65;

            if (mode === "enkripsi") {

                kode = (kode + nilaiKunci) % 26;

            } else {

                kode = (kode - nilaiKunci + 26) % 26;

            }

            hasil += String.fromCharCode(kode + 65);

            indexKunci++;

        } else {

            hasil += karakter;

        }

    }

    return hasil;

}


function enkripsi() {

    let pesan =
        document.getElementById("pesan").value;

    let kunci =
        document.getElementById("kunci").value;

    if (kunci === "") {

        alert("Kunci harus diisi!");

        return;

    }

    let hasil =
        prosesVigenere(
            pesan,
            kunci,
            "enkripsi"
        );

    document.getElementById("hasil").innerText =
        hasil;

}


function dekripsi() {

    let pesan =
        document.getElementById("pesan").value;

    let kunci =
        document.getElementById("kunci").value;

    if (kunci === "") {

        alert("Kunci harus diisi!");

        return;

    }

    let hasil =
        prosesVigenere(
            pesan,
            kunci,
            "dekripsi"
        );

    document.getElementById("hasil").innerText =
        hasil;

}

</script>

</body>

</html>
